workPath: '~/sims/variable_graph_MAS/sims/easyTest/'
EnvType: 'polygonEnv'

# Interface: which interface is being used for updating the state? (ODE solver---which one? Robot---which one? etc.)
# nsfPlots for nsf plots, Euler for Euler integration, odeInt for ode integration using scipy, odeSolo for single-agent navigation by leader w/out changing other parameters
EnvInfo:
  Interface: 'odeInt'
  WorkspaceBdry: # defines a rectangular domain with boundary parallel to the axes
    Xmax: 10
    Ymax: 10
    Xmin: 0
    Ymin: 0
  Dim: 2 # Number of dimensions. Only 2-dimensional is implemented

  Obstacles:
    One:
      vertices: [[2.,6.17],[2.,7.17,],[3.,6.17],[3.,7.17]]
    Two: 
      vertices: [[6.,1.33],[6.,2.67],[7.33,1.33],[7.33,2.67]]
    Three:
      vertices: [[6.67,6.],[6.67,7.33],[8.,6.],[8.,7.33]]
    Four:
      vertices: [[4.5,8.5],[4.5,9.5],[5.5,8.5],[5.5,9.5]]
    Five:
      vertices: [[2.83,1.83],[2.83,2.83],[3.83,1.83],[3.83,2.83]]
  
  DiffeoParams:
    p: 20
    epsilon: 0.25
    varepsilon: 0.25
    mu_1: 0.0625 # must be roughly equal to epsilon^2, so that the switch scales almost linearly with beta
    mu_2: 0.01 # must be small so that sigma reaches the value of sigma_beta almost immediately
    workspace: [[0.,0.],[0.,10.],[10.,10.],[10.,0.]] # The counterclockwise (or clockwise?) order is important here

Network:
  netID: 'AutonomyPark'
  networkInfo:
    Duration: 300
    networkTask:
      Goals:
        Goal1: [9., 9.]
        Goal2: [4.02, 7.]
        Goal3: [-5.2, 6.]
    Agents:
      Initialization: "Provided" # the other option is "Random"
      AgentInfo:
        Zoe:
          Type: "fullyActuatedAgent" # Corresponding class in agent.py
          State:
            q: [[2., 1.67]] # The double brackets makes numpy.shape(q) output (1, 2) instead of (2,)
            p: [[1., 0.]]
          Task:
            Target: 'Goal1'
            KeepUpQ: False
        Bravo:
          Type: "fullyActuatedAgent"
          State:
            q: [[1.33, 1.]]
            p: [[1., 0.]]
          Task:
            Target: 'Goal1'
            KeepUpQ: True
        Charlie:
          Type: "fullyActuatedAgent"
          State:
            q: [[0.67, 0.67]]
            p: [[1., 0.]]
          Task:
            Target: 'Goal1'
            KeepUpQ: True
        Delta:
          Type: "fullyActuatedAgent"
          State:
            q: [[0.33, 0.33]]
            p: [[1., 0.]]
          Task:
            Target: 'Goal1'
            KeepUpQ: True
        Echo:
          Type: "fullyActuatedAgent"
          State:
            q: [[1., 0.33]]
            p: [[1., 0.]]
          Task:
            Target: 'Goal1'
            KeepUpQ: True
        Foxtrot:
          Type: "fullyActuatedAgent"
          State:
            q: [[1.67, 0.67]]
            p: [[1., 0.]]
          Task:
            Target: 'Goal1'
            KeepUpQ: True
        Golf:
          Type: "fullyActuatedAgent"
          State:
            q: [[2.67, 1.]]
            p: [[1., 0.]]
          Task:
            Target: 'Goal1'
            KeepUpQ: True
        Hotel:
          Type: "fullyActuatedAgent"
          State:
            q: [[3.33, 0.67]]
            p: [[1., 0.]]
          Task:
            Target: 'Goal1'
            KeepUpQ: True
        India:
          Type: "fullyActuatedAgent"
          State:
            q: [[3.67, 0.33]]
            p: [[1., 0.]]
          Task:
            Target: 'Goal1'
            KeepUpQ: True
        Juliett:
          Type: "fullyActuatedAgent"
          State:
            q: [[3., 0.33]]
            p: [[1., 0.]]
          Task:
            Target: 'Goal1'
            KeepUpQ: True
        Kilo:
          Type: "fullyActuatedAgent"
          State:
            q: [[2.33, 0.67]]
            p: [[1., 0.]]
          Task:
            Target: 'Goal1'
            KeepUpQ: True
    Edges:
      - ["Zoe", "Bravo"]
      - ["Bravo", "Zoe"]
      - ["Bravo", "Charlie"]
      - ["Charlie", "Bravo"]
      - ["Charlie", "Delta"]
      - ["Delta", "Charlie"]
      - ["Charlie", "Echo"]
      - ["Echo", "Charlie"]
      - ["Bravo", "Foxtrot"]
      - ["Foxtrot", "Bravo"]
      - ["Zoe", "Golf"]
      - ["Golf", "Zoe"]
      - ["Golf", "Hotel"]
      - ["Hotel", "Golf"]
      - ["Hotel", "India"]
      - ["India", "Hotel"]
      - ["Hotel", "Juliett"]
      - ["Juliett", "Hotel"]
      - ["Golf", "Kilo"]
      - ["Kilo", "Golf"]
    pnpParameters:
      Lazy: 0
      coopGain: 10  # mu///omega for lazy
      leaderGain: 0.215 #(this is gamma)
      alpha: 1.01
      rsafe: 0.7
      rcomm: 3


