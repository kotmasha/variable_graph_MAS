    Edges:
      - ["Zoe", "Bravo"]
      - ["Bravo", "Zoe"]
      - ["Bravo", "Charlie"]
      - ["Charlie", "Bravo"]
      - ["Charlie", "Delta"]
      - ["Delta", "Charlie"]
      - ["Charlie", "Echo"]
      - ["Echo", "Charlie"]
      - ["Bravo", "Foxtrot"]
      - ["Foxtrot", "Bravo"]
      - ["Zoe", "Golf"]
      - ["Golf", "Zoe"]
      - ["Golf", "Hotel"]
